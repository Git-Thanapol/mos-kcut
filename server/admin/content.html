<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>KCUT · จัดการเนื้อหา</title>
  <style>
    :root { --bg:#f4f5f7; --card:#fff; --ink:#1f2430; --mut:#6b7280; --line:#e2e5ea; --brand:#4f46e5; --ok:#15803d; --bad:#b91c1c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: 'Prompt', system-ui, sans-serif; background:var(--bg); color:var(--ink); }
    main { max-width: 880px; margin: 0 auto; padding: 16px 16px 96px; }
    h1 { font-size: 1.25rem; } h2 { font-size: 1.05rem; margin: 0; }
    details { background:var(--card); border:1px solid var(--line); border-radius:12px; margin:12px 0; }
    summary { padding:14px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .body { padding: 0 16px 16px; }
    .item { border-top:1px solid var(--line); padding:14px 0; display:grid; gap:10px; }
    label { display:grid; gap:4px; font-size:.85rem; color:var(--mut); }
    input[type=text], input[type=number], input[type=password], textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; color:var(--ink); background:#fff; }
    textarea { min-height: 72px; resize: vertical; }
    .invalid { border-color: var(--bad) !important; }
    .err { color: var(--bad); font-size:.8rem; }
    button { font:inherit; padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
    button.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
    button:disabled { opacity:.5; cursor:default; }
    .media { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .media img, .media video { width:140px; height:84px; object-fit:cover; border-radius:8px; background:#000; }
    .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; width:140px; }
    .bar > i { display:block; height:100%; width:0; background:var(--brand); }
    #bar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .ok { color:var(--ok); } .bad { color:var(--bad); }
  </style>
</head>
<body>
  <main id="app" hidden>
    <h1>จัดการเนื้อหาหน้าเว็บ KCUT <a href="/admin" style="float:right;font-size:.85rem;font-weight:400">ตรวจสลิป/ออเดอร์ →</a></h1>
    <div id="sections"></div>
  </main>
  <div id="bar" hidden>
    <span id="status"></span>
    <span>
      <a href="/" target="_blank" rel="noopener">ดูหน้าเว็บ</a>
      <button class="primary" id="save" disabled>บันทึกและเผยแพร่</button>
    </span>
  </div>
  <script src="/admin/content.js"></script>
</body>
</html>
